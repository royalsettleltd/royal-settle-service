server:
  port: ${PORT:9030}
  servlet:
    context-path: /api/v1/royal-settle
  compression:
    enabled: true

spring:
  application:
    name: royal-settle-service
  profiles:
    default: dev

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Africa/Lagos

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  task:
    scheduling:
      pool:
        size: 4
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 200
        keep-alive: 30s

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    africa.royalsettle: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"